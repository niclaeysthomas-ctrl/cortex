<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cortex">
<link rel="manifest" href='data:application/manifest+json,{"name":"CORTEX","short_name":"Cortex","display":"standalone","background_color":"#0a0b12","theme_color":"#0a0b12","start_url":".","icons":[]}'>
<title>CORTEX — grilles de lecture</title>
<style>
  :root{
    --bg:#0a0b12; --bg2:#12141f; --bg3:#1a1d2c; --bg4:#232739; --line:#2c3145;
    --txt:#eceefb; --dim:#8a90a8; --dim2:#636a85;
    --acc:#7c6cff; --acc2:#9a8dff; --mint:#2ee0c0; --amber:#f5b840;
    --master:#7c6cff; --predire:#2ee0c0; --decider:#5b9cff;
    --ok:#3ecf7a; --bad:#ff5c6c; --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;line-height:1.55}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
  main{flex:1;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:20px;letter-spacing:3px}
  .logo b{color:var(--acc)}
  .hbadges{display:flex;gap:7px}
  .hb{font-weight:800;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:6px 11px;border-radius:20px;display:flex;align-items:center;gap:4px}
  .hb.streak{color:var(--amber)}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  h1.page{font-size:24px;font-weight:900;margin:6px 0 4px;letter-spacing:.3px}
  .page-sub{color:var(--dim);font-size:13.5px;margin-bottom:16px}
  .sub{color:var(--dim);font-size:13px}
  .mini{font-size:11.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}

  .hero{background:linear-gradient(140deg,#191533,#241a3a 60%,#122630);position:relative;overflow:hidden}
  .hero .lvltag{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;font-weight:700}
  .hero .lvlname{font-size:26px;font-weight:900;margin:3px 0 12px;background:linear-gradient(90deg,var(--acc2),var(--mint));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .xpbar{height:9px;background:#0009;border-radius:5px;overflow:hidden}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--mint));border-radius:5px;transition:width .5s}
  .hero .xptxt{font-size:12px;color:var(--dim);margin-top:7px;display:flex;justify-content:space-between}

  .quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .quest:last-child{border-bottom:none}
  .quest .qi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--bg3);flex-shrink:0}
  .quest .qt{flex:1}
  .quest .qt b{font-size:14.5px;font-weight:700}
  .quest .qt small{display:block;color:var(--dim);font-size:12px}
  .quest .qx{font-size:12px;font-weight:800;color:var(--dim2)}
  .quest.done .qx{color:var(--ok)}
  .quest.done .qi{background:#12321f}

  .btn{display:block;border:none;border-radius:13px;padding:15px 20px;font-size:15.5px;font-weight:800;cursor:pointer;
    background:var(--acc);color:#fff;width:100%;text-align:center;margin-top:12px;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.mint{background:var(--mint);color:#052420}
  .btn.small{padding:11px 16px;font-size:14px}
  .btn:disabled{opacity:.4;cursor:default}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 .btn{margin-top:0}

  .tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;letter-spacing:.3px}
  .tag.dom{background:#241f4a;color:var(--acc2)}
  .tag.pointu{background:#3a2f12;color:var(--amber)}
  .tag.std{background:#0f3630;color:var(--mint)}
  .tag.p{background:#0f3630;color:var(--mint)}

  .reveal{background:var(--bg3);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;padding:13px 15px;margin-top:12px;font-size:14.5px;color:#d8dbee;animation:fade .3s}
  .reveal.ok{border-color:var(--ok)} .reveal.bad{border-color:var(--bad)}
  .reveal.amber{border-color:var(--amber)}
  .reveal.mint{border-color:var(--mint)}
  .reveal b{color:#fff} .reveal i{color:#c3c8e6}
  .reveal .lbl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;color:var(--dim)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  .grille{list-style:none;margin-top:6px}
  .grille li{position:relative;padding:6px 0 6px 20px;font-size:14px;color:#d3d7ee;border-bottom:1px solid var(--line)}
  .grille li:last-child{border-bottom:none}
  .grille li:before{content:'▸';position:absolute;left:0;color:var(--acc2);font-weight:900}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:900}
  .stat small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}

  .slwrap{margin:20px 0 6px}
  input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:5px;
    background:linear-gradient(90deg,var(--bad),var(--dim2) 50%,var(--mint));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
    background:#fff;border:3px solid var(--acc);cursor:pointer;box-shadow:0 2px 8px #000a}
  .slval{text-align:center;font-size:38px;font-weight:900;margin:4px 0}
  .slval small{font-size:15px;color:var(--dim);font-weight:600}
  .slscale{display:flex;justify-content:space-between;font-size:11px;color:var(--dim2);margin-top:2px}

  input[type=text],textarea,select{width:100%;background:var(--bg3);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--txt);font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text}
  textarea{resize:vertical;min-height:64px}
  label.fl{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin:14px 0 6px}

  .deccard{border-left:3px solid var(--decider)}
  .deccard.rev{border-left-color:var(--amber)}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:12px;background:var(--bg4);color:var(--dim)}
  .pill.ok{background:#12321f;color:var(--ok)} .pill.bad{background:#321518;color:var(--bad)}

  .calchart{display:flex;align-items:flex-end;gap:3px;height:110px;margin:8px 0 4px;padding-top:4px}
  .calbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
  .calbar i{display:block;background:var(--mint);border-radius:3px 3px 0 0;min-height:2px}
  .calbar u{position:absolute;left:0;right:0;border-top:1px dashed var(--dim2)}

  .libitem{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .libitem b{font-size:15px;display:block;margin:6px 0 3px}
  .empty{text-align:center;color:var(--dim2);padding:40px 20px;font-size:14px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .flag{background:linear-gradient(135deg,#1a1d2c,#12141f);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--dim);margin-top:14px}
  .flag b{color:var(--amber)}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,14,22,.92);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50;max-width:560px;margin:0 auto}
  .nav-i{flex:1;text-align:center;padding:6px 2px;cursor:pointer;color:var(--dim2);transition:.15s}
  .nav-i .ic{font-size:22px;line-height:1}
  .nav-i span{display:block;font-size:10px;font-weight:700;margin-top:3px;letter-spacing:.2px}
  .nav-i.on{color:var(--acc)}
  .nav-i.on[data-r=predire]{color:var(--mint)} .nav-i.on[data-r=decider]{color:var(--decider)}
  .nav-i.on[data-r=transfert]{color:var(--amber)}
  .opt{display:block;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;margin-top:9px;font-size:14.5px;font-weight:600;color:var(--txt);cursor:pointer;transition:.12s}
  .opt:active{transform:scale(.99)}
  .opt.right{border-color:var(--ok);background:#12321f;color:#bff3d0}
  .opt.wrong{border-color:var(--bad);background:#321518;color:#ffc7cd}
  .opt.dim{opacity:.5}
  .lucidbar{display:flex;gap:8px;margin-top:14px}
  .lucidbar button{flex:1}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
    background:var(--acc);color:#fff;font-weight:800;padding:11px 20px;border-radius:24px;z-index:100;
    box-shadow:0 8px 24px #000a;animation:pop .3s;font-size:14px;white-space:nowrap;max-width:90%;text-align:center}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">COR<b>TEX</b></div>
    <div class="hbadges">
      <div class="hb streak">🔥 <span id="hStreak">0</span></div>
      <div class="hb">Nv <span id="hLvl">1</span></div>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<script src="data.js"></script>
<script src="transfert.js"></script>
<script>
/* ================= ÉTAT ================= */
const LS='cortex_v2';
const DEFAULT={
  xp:0, streak:0, lastDay:null, quests:{date:null, m:0, p:0, d:0, t:0},
  master:{}, // id -> {ef,int,reps,due,grade,answer,apply}
  calib:{recs:[], seen:[], preds:[]},
  decisions:[],
  transfer:{items:{}, recs:[], seen:[]}, // items: id->{ef,int,reps,due}  recs:[{ok}]  seen:[scenarioId]
  lucid:{seen:0, vu:0, partiel:0}, // anticipation du twist avant révélation
  seanceLog:[], // dates des séances quotidiennes bouclées
  missions:{log:[], fermi:[], sSeen:[], fSeen:[]} // log:[{type,date,...}] fermi:[{orders}] sSeen/fSeen: index vus
};
let S=load();
function load(){try{return Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(localStorage.getItem(LS))||{})}catch(e){return JSON.parse(JSON.stringify(DEFAULT))}}
/* normalisation : champs ajoutés après coup pour les états déjà stockés */
if(!S.transfer)S.transfer={items:{},recs:[],seen:[]};
if(!S.transfer.items)S.transfer.items={};
if(!S.lucid)S.lucid={seen:0,vu:0,partiel:0};
if(!S.seanceLog)S.seanceLog=[];
if(!S.missions)S.missions={log:[],fermi:[],sSeen:[],fSeen:[]};
function save(){localStorage.setItem(LS,JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const LEVELS=[
 {min:0,nom:'Esprit brut'},{min:120,nom:'Éveil'},{min:340,nom:'Aiguisé'},
 {min:720,nom:'Analyste'},{min:1300,nom:'Lucide'},{min:2200,nom:'Stratège'},
 {min:3600,nom:'Clairvoyant'},{min:5600,nom:'Cortex'},{min:8500,nom:'Cortex Ω'}];
function levelInfo(){let i=0;for(let k=0;k<LEVELS.length;k++)if(S.xp>=LEVELS[k].min)i=k;
  const cur=LEVELS[i],nxt=LEVELS[i+1];
  return {i:i+1,nom:cur.nom,cur:cur.min,nxt:nxt?nxt.min:cur.min,max:!nxt};}

function touchStreak(){const t=today();if(S.lastDay===t)return;
  if(S.lastDay && daysBetween(S.lastDay,t)===1)S.streak++;else S.streak=1;S.lastDay=t;}
function ensureQuests(){if(S.quests.date!==today())S.quests={date:today(),m:0,p:0,d:0,t:0,seance:0};}
function addXP(n,label){const before=levelInfo().i;S.xp+=n;touchStreak();save();
  const after=levelInfo().i;
  if(after>before)toast(`⬆️ Niveau ${after} — ${LEVELS[after-1].nom}`,1900);
  else if(label)toast(`+${n} XP · ${label}`);
  syncHeader();}
function syncHeader(){document.getElementById('hStreak').textContent=S.streak;document.getElementById('hLvl').textContent=levelInfo().i;}
let toastT;
function toast(msg,ms=1400){clearTimeout(toastT);let e=document.querySelector('.toast');if(e)e.remove();
  e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);
  toastT=setTimeout(()=>e.remove(),ms);}

/* ================= ROUTAGE ================= */
const NAV=[
 {r:'accueil',ic:'🏠',t:'Accueil'},
 {r:'master',ic:'📖',t:'Grilles'},
 {r:'transfert',ic:'🔀',t:'Transfert'},
 {r:'predire',ic:'🎯',t:'Prédire'},
 {r:'decider',ic:'🗂️',t:'Décisions'}];
let route='accueil';
function go(r){route=r;render();window.scrollTo(0,0);}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(n=>
  `<div class="nav-i ${route===n.r?'on':''}" data-r="${n.r}" onclick="go('${n.r}')">
     <div class="ic">${n.ic}</div><span>${n.t}</span></div>`).join('');}
function render(){ensureQuests();renderNav();syncHeader();
  const v=document.getElementById('view');
  v.innerHTML=({accueil:vAccueil,master:vMaster,transfert:vTransfert,seance:vSeance,profil:vProfil,mission:vMissions,predire:vPredire,decider:vDecider}[route])();
  if(route==='predire')mountPredire();
  if(route==='master')mountMaster();
  if(route==='transfert')mountTransfert();
  if(route==='seance')mountSeance();}

/* ================= ACCUEIL ================= */
function vAccueil(){
  const L=levelInfo();
  const prog=L.max?100:Math.round((S.xp-L.cur)/(L.nxt-L.cur)*100);
  const q=S.quests;
  const due=queueMaster();
  const learned=Object.keys(S.master).length;
  const toReview=S.decisions.filter(d=>!d.reviewed&&d.reviewDate<=today()).length;
  const brier=avgBrier();
  const tQ=queueTransfert();
  const quests=[
    {ic:'📖',t:'Étudier une grille de lecture',s:due.mode==='review'?`${due.dueN} à réviser`:due.mode==='new'?`${MASTERCLASS.length-learned} nouvelles`:'Bibliothèque à jour ✓',done:q.m>0,r:'master'},
    {ic:'🔀',t:'Repérer une grille en situation',s:tQ.mode==='review'?`${tQ.dueN} à rejouer`:tQ.mode==='new'?`${tQ.freshN} cas à découvrir`:'Tous les cas vus ✓',done:q.t>0,r:'transfert'},
    {ic:'🎯',t:'Calibrer 3 prédictions',s:`${Math.min(q.p,3)}/3 aujourd'hui`,done:q.p>=3,r:'predire'},
    {ic:'🗂️',t:'Journal de décision',s:toReview?`${toReview} à évaluer !`:'Logger ou évaluer',done:q.d>0,r:'decider'},
  ];
  const doneCount=quests.filter(x=>x.done).length;
  return `
  <div class="card hero">
    <div class="lvltag">Niveau ${L.i}${L.max?' · MAX':''}</div>
    <div class="lvlname">${L.nom}</div>
    <div class="xpbar"><i style="width:${prog}%"></i></div>
    <div class="xptxt"><span>${S.xp} XP</span><span>${L.max?'Sommet atteint':`${L.nxt} XP → Nv ${L.i+1}`}</span></div>
  </div>
  <div class="stats">
    <div class="stat"><b style="color:var(--amber)">${S.streak}</b><small>🔥 Série</small></div>
    <div class="stat"><b style="color:var(--acc2)">${learned}<span style="font-size:14px;color:var(--dim)">/${MASTERCLASS.length}</span></b><small>Grilles</small></div>
    <div class="stat"><b style="color:var(--mint)">${brier===null?'—':brier.toFixed(2)}</b><small>Brier</small></div>
  </div>
  ${S.quests.seance?
    `<div class="card" style="border-color:var(--mint);display:flex;align-items:center;gap:12px">
       <div style="font-size:26px">✓</div>
       <div><b style="font-size:15px">Séance du jour faite.</b><span class="sub" style="display:block">Le reste se passe dehors. Ferme et va vivre.</span></div>
     </div>`:
    `<button class="btn" style="font-size:16px;padding:17px" onclick="startSeance()">▶ Commencer la séance du jour · ~20 min</button>
     <p class="sub" style="text-align:center;margin:8px 0 16px">Rappel → raisonnement → apprentissage → production. Un seul fil, pas quatre onglets à picorer.</p>`}
  <div class="row2" style="margin-bottom:12px">
    <button class="btn ghost small" style="margin:0" onclick="go('mission')">🎯 Missions</button>
    <button class="btn ghost small" style="margin:0" onclick="go('profil')">🧭 Profil cognitif</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
      <b style="font-size:16px">Ou à la carte</b><span class="mini">${doneCount}/${quests.length}</span>
    </div>
    ${quests.map(x=>`
      <div class="quest ${x.done?'done':''}" onclick="go('${x.r}')">
        <div class="qi">${x.ic}</div>
        <div class="qt"><b>${x.t}</b><small>${x.s}</small></div>
        <div class="qx">${x.done?'✓':'→'}</div>
      </div>`).join('')}
    ${doneCount===quests.length?'<div class="reveal ok" style="margin-top:14px"><b>Journée pleine.</b> Une grille apprise, une repérée en situation, ta calibration nourrie, une décision tracée. C\'est la régularité qui compose.</div>':''}
  </div>
  <div class="flag">
    <b>Le vrai test.</b> Une grille de lecture ne vaut que si tu la <b>repères</b> puis l'<b>appliques</b>. Étudier sans le reconnaître dans la nature = consommation qui flatte et ne change rien. Transfert, Prédire et Décisions sont là pour ça : mesurer si tes grilles tiennent au contact du réel.
  </div>`;
}

/* ================= MASTERCLASS ================= */
let curM=null, mStage=0, curMode='new';
function lucidRate(){const s=S.lucid.seen||0;if(s<4)return null;return Math.round(((S.lucid.vu||0)+0.5*(S.lucid.partiel||0))/s*100);}
const DOMAINES=[...new Set(MASTERCLASS.map(f=>f.dom))];
/* entrelace : choisit une nouvelle grille dans le domaine le moins avancé */
function pickFresh(fresh){
  const learnedByDom={};
  MASTERCLASS.forEach(f=>{ if(S.master[f.id]) learnedByDom[f.dom]=(learnedByDom[f.dom]||0)+1; });
  return fresh.slice().sort((a,b)=>(learnedByDom[a.dom]||0)-(learnedByDom[b.dom]||0))[0];
}
function queueMaster(){
  const foc=S.focusDom, inFoc=f=>!foc||f.dom===foc;
  const due=MASTERCLASS.filter(f=>S.master[f.id]&&S.master[f.id].due<=today()&&inFoc(f));
  const fresh=MASTERCLASS.filter(f=>!S.master[f.id]&&inFoc(f));
  if(due.length)return {item:due[0],mode:'review',dueN:due.length,freshN:fresh.length};
  if(fresh.length)return {item:pickFresh(fresh),mode:'new',dueN:0,freshN:fresh.length};
  return {item:null,mode:'done',dueN:0,freshN:0};
}
function setFocusDom(d){ S.focusDom=(d===S.focusDom||d==='')?null:d; save(); render(); }
function domChips(){
  const foc=S.focusDom;
  const chip=(d,label)=>`<button onclick="setFocusDom('${d}')" style="flex:0 0 auto;background:${(foc||'')===d?'var(--acc)':'var(--bg3)'};color:${(foc||'')===d?'#fff':'var(--dim)'};border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap">${label}</button>`;
  return `<div style="display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px 4px">
    ${chip('','Tous')}${DOMAINES.map(d=>chip(d,d)).join('')}</div>`;
}
function vMaster(){
  const Q=queueMaster();
  const learned=Object.keys(S.master).length;
  if(!Q.item){
    return `<h1 class="page">Masterclass</h1>
    <p class="page-sub">Grilles de lecture non-évidentes. Profondeur reliée au réel.</p>
    ${domChips()}
    <div class="card" style="text-align:center">
      <div style="font-size:44px">✓</div>
      <b style="font-size:18px">${S.focusDom?`« ${S.focusDom} » à jour`:'Bibliothèque à jour'}</b>

function anticiper(kind){

/* planification SM-2 d'une grille (partagée module + séance) */
function schedMaster(f,g){
  let d=S.master[f.id]||{ef:2.5,int:0,reps:0};
  if(g<3){d.reps=0;d.int=1;}
  else{d.reps++;
    d.int=d.reps===1?1:d.reps===2?4:Math.round(d.int*d.ef);
    d.ef=Math.max(1.3,d.ef+(0.1-(5-g)*(0.08+(5-g)*0.02)));}
  const due=new Date();due.setDate(due.getDate()+d.int);d.due=due.toISOString().slice(0,10);d.grade=g;
  S.master[f.id]=d;return d;
}

  const d=schedMaster(curM,g);
  if(!S.quests.m)S.quests.m=1;save();

/* ================= TRANSFERT =================
   Le muscle décisif : reconnaître QUELLE grille s'applique à une
   situation réelle non étiquetée (transfert analogique, Gick & Holyoak).
   Interleaving discriminatif + re-surface des erreurs en espacé.        */
let curScen=null, scenAnswered=false;
function transRate(){let hit=0,miss=0;
  Object.values(S.transfer.items||{}).forEach(it=>{hit+=it.hit||0;miss+=it.miss||0;});
  const n=hit+miss;return n?Math.round(hit/n*100):null;}
function queueTransfert(){
  const items=S.transfer.items||{};
  const due=SCENARIOS.filter(s=>items[s.id]&&items[s.id].due<=today());
  const fresh=SCENARIOS.filter(s=>!S.transfer.seen.includes(s.id));
  if(due.length)return {item:due[0],mode:'review',dueN:due.length,freshN:fresh.length};
  if(fresh.length){
    const seenByDom={};SCENARIOS.forEach(s=>{if(S.transfer.seen.includes(s.id))seenByDom[s.dom]=(seenByDom[s.dom]||0)+1;});
    const pick=fresh.slice().sort((a,b)=>(seenByDom[a.dom]||0)-(seenByDom[b.dom]||0))[0];
    return {item:pick,mode:'new',dueN:0,freshN:fresh.length};
  }
  return {item:null,mode:'done',dueN:0,freshN:0};
}
function vTransfert(){
  const Q=queueTransfert();
  const seenN=S.transfer.seen.length,rate=transRate(),n=S.transfer.recs.length;
  const head=`<h1 class="page">Transfert</h1>
  <p class="page-sub">Le muscle décisif : reconnaître <b>quelle grille</b> s'applique à une situation réelle non étiquetée. Consommer 61 grilles ne sert à rien si tu ne les repères pas dans la nature.</p>
  <div class="stats">
    <div class="stat"><b style="color:var(--mint)">${rate===null?'—':rate+'%'}</b><small>Reconnaissance</small></div>
    <div class="stat"><b style="color:var(--acc2)">${seenN}<span style="font-size:14px;color:var(--dim)">/${SCENARIOS.length}</span></b><small>Cas vus</small></div>
    <div class="stat"><b>${n}</b><small>Tentatives</small></div>
  </div>`;
  if(!Q.item){
    return head+`<div class="card" style="text-align:center">
      <div style="font-size:44px">✓</div>
      <b style="font-size:18px">Tous les cas passés en revue</b>
      <p class="sub" style="margin-top:6px">La reconnaissance se rejoue en révision espacée — les cas ratés reviennent plus vite. Reviens demain.</p>
    </div>`;
  }
  return head+`<div class="card" id="scenCard"></div>`;
}
function mountTransfert(){if(document.getElementById('scenCard'))renderScen();}
function renderScen(){
  const Q=queueTransfert();curScen=Q.item;scenAnswered=false;
  if(!curScen){go('transfert');return;}
  const s=curScen;
  const idx=s.options.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  document.getElementById('scenCard').innerHTML=`

    </div>

    <div id="scenReveal"></div>`;
}
/* planification d'un scénario de transfert (partagée module + séance) */
function schedScen(s,ok){
  const items=S.transfer.items||(S.transfer.items={});
  let d=items[s.id]||{ef:2.5,int:0,reps:0};
  if(ok){d.reps++;d.int=d.reps===1?2:d.reps===2?6:Math.round(d.int*2.4);}
  else{d.reps=0;d.int=1;}
  d.hit=(d.hit||0)+(ok?1:0);d.miss=(d.miss||0)+(ok?0:1);
  const due=new Date();due.setDate(due.getDate()+d.int);d.due=due.toISOString().slice(0,10);
  items[s.id]=d;
  if(!S.transfer.seen.includes(s.id))S.transfer.seen.push(s.id);
  S.transfer.recs.push({ok});if(S.transfer.recs.length>200)S.transfer.recs.shift();
  return d;
}
function answerScen(chosen){
  if(scenAnswered)return;scenAnswered=true;

  document.getElementById('scenReveal').innerHTML=`
    <div class="reveal ${ok?'ok':'bad'}" style="margin-top:14px"><span class="lbl">${ok?'Vu juste':'La bonne grille : '+s.options[s.correct]}</span>${s.why}</div>

    <button class="btn" style="margin-top:12px" onclick="renderScen()">Cas suivant →</button>`;
  document.getElementById('scenReveal').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ================= LA SÉANCE =================
   Le fil conducteur : un flux quotidien guidé ~20 min qui enchaîne
   rappel actif → raisonnement → apprentissage → production, dans
   l'ordre pédagogique. Ce n'est PAS un 5e mini-jeu : c'est ce qui
   relie les autres. Se termine par « ferme-moi et va vivre ».       */
let Sess=null;
function buildSeance(){
  const steps=[];
  /* Phase 1 — Rappel actif : jusqu'à 2 grilles dues, en restitution de mémoire */
  const dueGrilles=MASTERCLASS.filter(f=>S.master[f.id]&&S.master[f.id].due<=today());
  dueGrilles.slice(0,2).forEach(f=>steps.push({phase:'Rappel actif',ic:'🧠',type:'recall',item:f}));
  /* Phase 2 — Raisonnement : jusqu'à 3 scénarios de transfert (dus d'abord, sinon neufs) */
  const dueScen=SCENARIOS.filter(s=>S.transfer.items[s.id]&&S.transfer.items[s.id].due<=today());
  const freshScen=SCENARIOS.filter(s=>!S.transfer.seen.includes(s.id));
  [...dueScen,...freshScen].slice(0,3).forEach(s=>steps.push({phase:'Raisonnement',ic:'🔀',type:'reason',item:s}));
  /* Phase 3 — Apprentissage : 1 nouvelle grille (avec anticipation) */
  const fresh=MASTERCLASS.filter(f=>!S.master[f.id]);
  const learnItem=fresh.length?pickFresh(fresh):null;
  if(learnItem)steps.push({phase:'Apprentissage',ic:'📖',type:'learn',item:learnItem});
  /* Phase 4 — Production : expliquer avec ses mots + parier une application (toujours présente) */
  const prodTarget=learnItem||dueGrilles[0]||MASTERCLASS[Math.floor(Math.random()*MASTERCLASS.length)];
  steps.push({phase:'Production',ic:'✍️',type:'produce',item:prodTarget});
  return {steps,idx:0,correct:0,ansScen:false};
}
function startSeance(){Sess=buildSeance();go('seance');}

function vSeance(){
  if(!Sess)Sess=buildSeance();

  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin:4px 0 10px">
      <div><div class="mini">Séance du jour · étape ${i}/${n}</div>

}

function sessAnswerScen(chosen){

  });
  const g=MASTERCLASS.find(m=>m.id===s.ref);
  document.getElementById('sReveal').innerHTML=`
    <div class="reveal ${ok?'ok':'bad'}" style="margin-top:14px"><span class="lbl">${ok?'Vu juste':'La bonne grille : '+s.options[s.correct]}</span>${s.why}</div>

/* ================= PRÉDIRE (calibration) ================= */
let curStmt=null, stmtAnswered=false;
function pickStmt(){const unseen=CALIB.map((s,i)=>i).filter(i=>!S.calib.seen.includes(i));
  const pool=unseen.length?unseen:CALIB.map((s,i)=>i);return pool[Math.floor(Math.random()*pool.length)];}
function avgBrier(){if(!S.calib.recs.length)return null;
  return S.calib.recs.reduce((a,r)=>a+Math.pow(r.p-(r.v?1:0),2),0)/S.calib.recs.length;}
function calibGap(){if(S.calib.recs.length<6)return null;
  const g=S.calib.recs.reduce((a,r)=>a+Math.abs(r.p-(r.v?1:0)),0)/S.calib.recs.length;return Math.round(g*100);}
function vPredire(){
  const b=avgBrier(),n=S.calib.recs.length;
  return `<h1 class="page">Prédire</h1>
  <p class="page-sub">L'exercice-roi de la métacognition. Tu paries un %, on mesure si ta confiance colle à la réalité.</p>
  <div class="stats">
    <div class="stat"><b style="color:var(--mint)">${b===null?'—':b.toFixed(3)}</b><small>Score Brier</small></div>
    <div class="stat"><b>${n}</b><small>Prédictions</small></div>
    <div class="stat"><b style="color:var(--acc2)">${calibGap()===null?'—':calibGap()+'%'}</b><small>Écart calib.</small></div>
  </div>
  ${n>=6?calibChart():''}
  <div class="card" id="stmtCard"></div>
  <div class="divider"></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <b style="font-size:16px">Tes prédictions perso</b>
    <button class="btn ghost small" style="width:auto;margin:0" onclick="openPredForm()">+ Ajouter</button>
  </div>
  <p class="sub" style="margin:6px 0 10px">Parie sur du vérifiable (un match, une deadline, un résultat). L'app te rappellera d'évaluer.</p>
  <div id="predList">${renderPreds()}</div>`;
}
function mountPredire(){renderStmt();}
function renderStmt(){curStmt=pickStmt();stmtAnswered=false;const s=CALIB[curStmt];
  document.getElementById('stmtCard').innerHTML=`
    <span class="tag p">Vrai ou faux ?</span>
    <p style="font-size:16.5px;margin:14px 0 4px;line-height:1.5">${s.t}</p>
    <div class="slwrap">
      <div class="slval"><span id="slNum">50</span><small>% que ce soit VRAI</small></div>
      <input type="range" min="0" max="100" value="50" id="slR" oninput="document.getElementById('slNum').textContent=this.value">
      <div class="slscale"><span>Sûr que FAUX</span><span>Aucune idée</span><span>Sûr que VRAI</span></div>
    </div>
    <button class="btn mint" onclick="answerStmt()">Valider mon pari</button>
    <div id="sReveal"></div>`;
}
function answerStmt(){if(stmtAnswered)return;stmtAnswered=true;const s=CALIB[curStmt];
  const p=(+document.getElementById('slR').value)/100;
  const brier=Math.pow(p-(s.v?1:0),2);
  S.calib.recs.push({p,v:s.v});
  if(!S.calib.seen.includes(curStmt))S.calib.seen.push(curStmt);
  if(S.calib.seen.length>=CALIB.length)S.calib.seen=[];
  S.quests.p=(S.quests.p||0)+1;save();addXP(8,'Prédiction calibrée');
  const conf=Math.round((s.v?p:1-p)*100);let verdict;
  if(s.v===(p>=0.5)){verdict=conf>=80?`Juste ET confiant — parfait.`:conf>=60?`Juste, tu aurais pu oser plus.`:`Juste, mais à contre-cœur : tu ne te faisais pas confiance.`;}
  else{verdict=conf<=40?`Faux — mais tu doutais, bien.`:conf<=60?`Faux, tu hésitais à raison.`:`Faux ET confiant. C'est LÀ qu'on apprend : où étais-tu sûr à tort ?`;}
  document.getElementById('sReveal').innerHTML=`
    <div class="reveal ${s.v===(p>=0.5)?'ok':'bad'}">
      <b>${s.v?'VRAI':'FAUX'}.</b> ${s.note}<br>
      <span style="color:var(--dim)">Ton pari : ${Math.round(p*100)}% vrai · Brier ${brier.toFixed(2)} (0 = parfait, 1 = pire). ${verdict}</span>
    </div>
    <button class="btn" onclick="renderStmt()">Suivante →</button>`;
}
function calibChart(){
  const bins=Array.from({length:5},()=>({sum:0,n:0}));
  S.calib.recs.forEach(r=>{let b=Math.min(4,Math.floor(r.p*5));bins[b].sum+=r.v?1:0;bins[b].n++;});
  const labels=['0-20','20-40','40-60','60-80','80-100'];
  return `<div class="card">
    <div class="mini" style="margin-bottom:8px">Ta courbe de calibration</div>
    <div class="calchart">
      ${bins.map((b,i)=>{const freq=b.n?b.sum/b.n:0;const ideal=(i*20+10);
        return `<div class="calbar"><u style="bottom:${ideal}%"></u>
          <i style="height:${b.n?Math.max(4,freq*100):0}%;${b.n?'':'background:var(--bg4)'}"></i></div>`}).join('')}
    </div>
    <div class="slscale">${labels.map(l=>`<span>${l}</span>`).join('')}</div>
    <p class="sub" style="margin-top:8px">Barre = % réel de « vrai » quand tu paries dans cette tranche. Pointillé = calibration parfaite. Barre au-dessus = trop prudent ; en-dessous = trop confiant.</p>
  </div>`;
}
function renderPreds(){
  if(!S.calib.preds.length)return '<div class="empty">Aucune prédiction perso.<br>Le vrai entraînement : parier sur TA vie et vérifier.</div>';
  return S.calib.preds.slice().reverse().map(p=>{
    const due=p.resolveDate<=today()&&!p.resolved;
    return `<div class="card" style="border-left:3px solid ${p.resolved?(p.outcome?'var(--ok)':'var(--bad)'):'var(--mint)'}">
      <div style="display:flex;justify-content:space-between;gap:8px">

      </div>
      <div class="sub" style="margin-top:6px">${p.resolved?`Tu pariais ${p.conf}% · ${p.outcome===(p.conf>=50)?'bien calibré':'à revoir'}`:`Échéance : ${p.resolveDate}`}</div>
      ${due?`<div class="row2" style="margin-top:10px">
        <button class="btn small mint" onclick="resolvePred('${p.id}',true)">C'est arrivé</button>

/* ================= PROFIL COGNITIF =================
   La carte de tes connaissances (lecture seule) : maîtrisé / oublié /
   erreurs récurrentes / sur- vs sous-confiance PAR DOMAINE. Ce n'est
   pas un score d'intelligence — c'est un miroir pour orienter l'effort. */
function domainProfile(){
  return DOMAINES.map(dom=>{
    const grilles=MASTERCLASS.filter(f=>f.dom===dom);
    const learned=grilles.filter(f=>S.master[f.id]).length;
    let hit=0,miss=0;
    SCENARIOS.filter(s=>s.dom===dom).forEach(s=>{const it=S.transfer.items[s.id];if(it){hit+=it.hit||0;miss+=it.miss||0;}});
    const attempts=hit+miss;
    return {dom,learned,total:grilles.length,recog:attempts?Math.round(hit/attempts*100):null,attempts};
  });
}
function vProfil(){
  const learnedIds=Object.keys(S.master);
  const mastered=learnedIds.filter(id=>S.master[id].reps>=3).length;
  const due=MASTERCLASS.filter(f=>S.master[f.id]&&S.master[f.id].due<=today()).length;
  const rec=transRate(),lr=lucidRate(),brier=avgBrier();
  const doms=domainProfile();
  const scored=doms.filter(d=>d.attempts>=3&&d.recog!==null);
  let blind=null,strong=null;
  scored.forEach(d=>{if(blind===null||d.recog<blind.recog)blind=d;if(strong===null||d.recog>strong.recog)strong=d;});
  const errs=SCENARIOS.map(s=>({s,it:S.transfer.items[s.id]}))
    .filter(x=>x.it&&(x.it.miss||0)>=2).sort((a,b)=>(b.it.miss||0)-(a.it.miss||0));
  let verdict;
  if(!scored.length){
    verdict=`<div class="flag"><b>Pas encore assez de matière.</b> Enchaîne quelques séances : la carte se dessine quand tu as tenté assez de grilles en situation. Un profil sans données, c'est de l'astrologie.</div>`;
  }else{
    verdict=`<div class="reveal ${blind&&blind.recog<50?'bad':'amber'}"><span class="lbl">Ton angle mort</span>
      <b>${blind.dom}</b> — tu as appris ${blind.learned}/${blind.total} grilles mais n'en reconnais que <b>${blind.recog}%</b> en situation. ${blind.recog<50?'Tu <b>connais</b> la théorie et tu ne la <b>vois</b> pas quand elle se présente : c\'est l\'illusion de compétence, la sur-confiance la plus coûteuse.':'À consolider côté application.'}</div>
      ${strong&&strong.dom!==blind.dom?`<div class="reveal ok"><span class="lbl">Là où tu te sous-estimes peut-être</span><b>${strong.dom}</b> — ${strong.recog}% de reconnaissance. Solide. Ne le fuis pas par confort : va chercher le pointu.</div>`:''}`;
  }
  return `<div style="display:flex;justify-content:space-between;align-items:center">
      <h1 class="page" style="margin-bottom:2px">Profil cognitif</h1>
      <button class="btn ghost small" style="width:auto;margin:0;padding:9px 13px" onclick="go('accueil')">✕</button>
    </div>
  <p class="page-sub">Pas une note d'intelligence — une carte de ce que tu maîtrises, oublies et sur-estimes. Un miroir, pas un trophée.</p>
  <div class="stats">
    <div class="stat"><b style="color:var(--acc2)">${mastered}<span style="font-size:14px;color:var(--dim)">/${learnedIds.length||0}</span></b><small>Ancrées</small></div>
    <div class="stat"><b style="color:var(--amber)">${due}</b><small>Qui s'effacent</small></div>
    <div class="stat"><b style="color:var(--mint)">${rec===null?'—':rec+'%'}</b><small>Reconnaissance</small></div>
  </div>
  <div class="card">
    <div class="mini" style="margin-bottom:4px">Ta lucidité & ta calibration</div>
    <p class="sub">Lucidité (tu vois le twist venir) : <b style="color:var(--txt)">${lr===null?'— (trop peu de grilles)':lr+'%'}</b> · Score de Brier (Prédire) : <b style="color:var(--txt)">${brier===null?'—':brier.toFixed(3)}</b></p>
  </div>
  ${verdict}
  <div class="mini" style="margin:20px 0 10px">Par domaine — savoir vs application</div>
  ${doms.map(d=>{const cov=Math.round(d.learned/d.total*100);
    return `<div class="libitem">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b style="font-size:14.5px">${d.dom}</b>
        <span class="sub">${d.recog===null?'jamais tenté en situation':`reconnu ${d.recog}%`}</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:8px">
        <span class="mini" style="width:54px">appris</span>
        <div class="xpbar" style="flex:1"><i style="width:${cov}%"></i></div>
        <span class="sub" style="width:44px;text-align:right">${d.learned}/${d.total}</span>
      </div>
      ${d.recog!==null?`<div style="display:flex;gap:6px;align-items:center;margin-top:6px">
        <span class="mini" style="width:54px">reconnu</span>
        <div class="xpbar" style="flex:1"><i style="width:${d.recog}%;background:linear-gradient(90deg,var(--mint),var(--acc2))"></i></div>
        <span class="sub" style="width:44px;text-align:right">${d.recog}%</span>
      </div>`:''}
    </div>`}).join('')}
  ${errs.length?`<div class="mini" style="margin:20px 0 10px;color:var(--bad)">Tes erreurs récurrentes (${errs.length})</div>
    ${errs.slice(0,6).map(x=>{const g=MASTERCLASS.find(m=>m.id===x.s.ref);
      return `<div class="libitem" style="border-left:3px solid var(--bad)">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <b style="font-size:14px">${g?g.titre:x.s.ref}</b>
          <span class="pill bad" style="flex-shrink:0">raté ${x.it.miss||0}×</span>
        </div>
        <span class="sub">${x.s.dom} · cette grille ne se déclenche pas encore chez toi. À revoir en priorité.</span>
      </div>`}).join('')}`:''}
  <div class="divider"></div>
  <p class="sub" style="text-align:center;margin-bottom:8px">Le progrès ne se lit pas dans un chiffre unique. Il se lit ici : l'angle mort qui rétrécit, l'erreur qui cesse de revenir.</p>`;
}

/* ================= MISSIONS (dans la vraie vie) =================
   Sortir de l'écran : steelman (défendre l'opinion opposée) et Fermi
   (estimer AVANT de chercher). Production active + calibration.        */
const STEELMAN=[
 "Le nucléaire est la meilleure réponse au changement climatique.",
 "Les très hautes rémunérations des dirigeants sont économiquement justifiées.",
 "Il faudrait supprimer le salaire minimum.",
 "La décroissance est la seule trajectoire soutenable.",
 "Les réseaux sociaux devraient être interdits aux moins de 16 ans.",
 "L'aide au développement fait globalement plus de mal que de bien.",
 "La spéculation financière est socialement utile.",
 "Un protectionnisme ciblé peut être rationnel pour un pays.",
 "Noter les élèves nuit plus qu'il n'aide à l'apprentissage.",
 "L'IA créera plus d'emplois qu'elle n'en détruira.",
 "La méritocratie est en grande partie une illusion.",
 "Une césure vaut mieux qu'un stage médiocre pris par peur du vide."
];
const FERMI=[
 {q:"Combien de baguettes de pain sont vendues en France chaque jour ?",val:3e7,unit:"baguettes",path:"~30 millions : ~67 M d'habitants, ~une demi-baguette/j en moyenne."},
 {q:"Combien pèse (en tonnes) tout l'or jamais extrait par l'humanité ?",val:2e5,unit:"tonnes",path:"~200 000 t — tiendrait dans un cube de ~22 m d'arête."},
 {q:"Combien de battements ton cœur fera-t-il dans une vie de 80 ans ?",val:3e9,unit:"battements",path:"~70/min × 60 × 24 × 365 × 80 ≈ 3 milliards."},
 {q:"Combien de litres d'eau pour produire 1 kg de bœuf (empreinte totale) ?",val:15000,unit:"litres",path:"~15 000 L : surtout l'eau des cultures fourragères."},
 {q:"Combien de smartphones sont vendus dans le monde chaque année ?",val:1.2e9,unit:"smartphones",path:"~1,2 milliard/an."},
 {q:"Combien de secondes vis-tu si tu atteins 80 ans ?",val:2.5e9,unit:"secondes",path:"80 × 365 × 24 × 3600 ≈ 2,5 milliards."},
 {q:"Combien de voitures particulières circulent en France ?",val:3.8e7,unit:"voitures",path:"~38 millions."},
 {q:"Combien de cellules dans un corps humain adulte ?",val:3.7e13,unit:"cellules",path:"~3,7 × 10¹³ (37 000 milliards)."},
 {q:"Combien de mots dans un roman de longueur moyenne ?",val:90000,unit:"mots",path:"~80 000–100 000 mots."},
 {q:"Quel est le budget annuel de dépenses de l'État français (pas toutes administrations) ?",val:5e11,unit:"€",path:"~500 milliards € (l'ensemble des administrations ~1 600 Md)."}
];
let curFermi=null,fermiAnswered=false;
function fermiMedianOrders(){if(!S.missions.fermi.length)return null;
  const arr=S.missions.fermi.map(x=>x.orders).sort((a,b)=>a-b);const m=arr[Math.floor(arr.length/2)];return m;}
function vMissions(){
  const doneN=S.missions.log.length;
  const fo=fermiMedianOrders();
  return `<div style="display:flex;justify-content:space-between;align-items:center">
      <h1 class="page" style="margin-bottom:2px">Missions</h1>
      <button class="btn ghost small" style="width:auto;margin:0;padding:9px 13px" onclick="go('accueil')">✕</button>
    </div>
  <p class="page-sub">Sortir de l'écran. Deux exercices que la théorie seule ne remplace pas : défendre le camp d'en face, et estimer avant de chercher.</p>
  <div class="stats">
    <div class="stat"><b style="color:var(--acc2)">${doneN}</b><small>Missions</small></div>
    <div class="stat"><b style="color:var(--mint)">${fo===null?'—':(fo<=1?'±1':'±'+fo.toFixed(1))}</b><small>Ordre Fermi</small></div>
    <div class="stat"><b style="color:var(--amber)">${S.missions.fermi.length}</b><small>Estimations</small></div>
  </div>
  <div class="card" style="border-color:var(--acc)">
    <div class="tag dom">Steelman</div>
    <h2 style="font-size:18px;font-weight:900;margin:10px 0 6px">Défends l'opinion opposée</h2>
    <p class="sub">Prends une thèse, écris le <b>meilleur</b> argument de chaque camp. Celui qui te vient le plus facilement révèle ton biais par défaut.</p>
    <button class="btn" onclick="startSteelman()">Lancer un steelman →</button>
  </div>
  <div class="card" style="border-color:var(--mint)">
    <div class="tag std">Estimation Fermi</div>
    <h2 style="font-size:18px;font-weight:900;margin:10px 0 6px">Estime avant de chercher</h2>
    <p class="sub">Un ordre de grandeur, à partir de rien. Google tue le muscle de l'estimation ; ici tu paries d'abord.</p>
    <button class="btn mint" onclick="startFermi()">Lancer une estimation →</button>
  </div>
  <div id="missionArea"></div>
  ${S.missions.log.length?`<div class="mini" style="margin:20px 0 8px">Historique</div>
    ${S.missions.log.slice().reverse().slice(0,8).map(m=>`<div class="libitem">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <b style="font-size:13.5px">${m.type==='steelman'?'🗣️ Steelman':'📐 Fermi'}</b>
        <span class="sub" style="flex-shrink:0">${m.date}</span>
      </div>
      <span class="sub">${esc((m.claim||m.q||'').slice(0,90))}</span>
    </div>`).join('')}`:''}`;
}
function pickIdx(seenArr,len){let un=[];for(let i=0;i<len;i++)if(!seenArr.includes(i))un.push(i);
  const pool=un.length?un:[...Array(len).keys()];return pool[Math.floor(Math.random()*pool.length)];}
function startSteelman(){
  const i=pickIdx(S.missions.sSeen,STEELMAN.length);
  const claim=STEELMAN[i];
  document.getElementById('missionArea').innerHTML=`
    <div class="card" style="border:1.5px solid var(--acc)">
      <div class="mini" style="color:var(--acc2)">La thèse à travailler</div>
      <p style="font-size:16px;font-weight:700;margin:8px 0 4px;line-height:1.4">« ${claim} »</p>
      <label class="fl">Le meilleur argument POUR (même si tu la rejettes)</label>
      <textarea id="stPour" placeholder="Le steelman du camp que tu n'aimes pas…"></textarea>
      <label class="fl">Le meilleur argument CONTRE</label>
      <textarea id="stContre" placeholder="Et l'autre côté, aussi fort…"></textarea>
      <p class="mini" style="margin:16px 0 8px">Lequel t'a été le plus facile à écrire ?</p>
      <div class="row2">
        <button class="btn small ghost" onclick="logSteelman(${i},'pour')">Le POUR</button>
        <button class="btn small ghost" onclick="logSteelman(${i},'contre')">Le CONTRE</button>
      </div>
    </div>`;
  document.getElementById('missionArea').scrollIntoView({behavior:'smooth',block:'start'});
}
function logSteelman(i,easier){
  const pour=(document.getElementById('stPour')||{}).value||'';
  const contre=(document.getElementById('stContre')||{}).value||'';
  if(!pour.trim()||!contre.trim()){toast('Écris les deux camps');return;}
  if(!S.missions.sSeen.includes(i))S.missions.sSeen.push(i);
  S.missions.log.push({type:'steelman',date:today(),claim:STEELMAN[i],pour:pour.trim(),contre:contre.trim(),easier});
  save();addXP(14,'Steelman posé');
  document.getElementById('missionArea').innerHTML=`<div class="reveal amber">
    <span class="lbl">Ton biais par défaut</span>
    Le camp qui t'est venu le plus facilement (<b>${easier==='pour'?'POUR':'CONTRE'}</b>) est ton point d'ancrage — pas forcément le plus juste, juste le plus <i>confortable</i>. La prochaine fois que tu défends cette position, souviens-toi que l'autre argument existait et que tu as su l'écrire. C'est ça, être difficile à tromper.
    </div>
    <button class="btn ghost" onclick="startSteelman()">Autre steelman →</button>`;
  document.getElementById('missionArea').scrollIntoView({behavior:'smooth',block:'start'});
}
function startFermi(){
  const i=pickIdx(S.missions.fSeen,FERMI.length);
  curFermi=i;fermiAnswered=false;
  document.getElementById('missionArea').innerHTML=`
    <div class="card" style="border:1.5px solid var(--mint)">
      <div class="mini" style="color:var(--mint)">Estimation — d'abord ta tête, pas Google</div>
      <p style="font-size:16px;font-weight:700;margin:8px 0 6px;line-height:1.4">${FERMI[i].q}</p>
      <label class="fl">Ton estimation (un nombre — « 3e7 » ou « 30000000 »)</label>
      <input type="text" id="feNum" placeholder="ordre de grandeur…" inputmode="numeric">
      <label class="fl">Ton raisonnement (comment tu y arrives)</label>
      <textarea id="feWhy" placeholder="Décompose : combien de X, fois combien de Y…"></textarea>
      <button class="btn mint" onclick="answerFermi()">Révéler l'écart →</button>
      <div id="feReveal"></div>
    </div>`;
  document.getElementById('missionArea').scrollIntoView({behavior:'smooth',block:'start'});
}
function answerFermi(){
  if(fermiAnswered)return;
  const raw=(document.getElementById('feNum')||{}).value||'';
  const est=parseFloat(raw.replace(/\s/g,'').replace(',','.'));
  if(!est||est<=0||!isFinite(est)){toast('Entre un nombre positif');return;}
  fermiAnswered=true;
  const f=FERMI[curFermi];
  const orders=Math.abs(Math.log10(est/f.val));
  if(!S.missions.fSeen.includes(curFermi))S.missions.fSeen.push(curFermi);
  S.missions.fermi.push({orders});
  S.missions.log.push({type:'fermi',date:today(),q:f.q,est,val:f.val,orders});
  save();addXP(orders<=1?14:9,'Estimation faite');
  const verdict=orders<=0.5?['ok','Excellent — dans le mille (moins d\'un demi-ordre).']
    :orders<=1?['ok','Solide — à moins d\'un ordre de grandeur. C\'est ça, l\'estimation utile.']
    :orders<=2?['amber','Correct-ish — un à deux ordres d\'écart. Où ton raisonnement a-t-il dérapé ?']
    :['bad','Loin — plus de deux ordres. Le piège classique : une étape de la chaîne mal estimée écrase tout.'];
  document.getElementById('feReveal').innerHTML=`
    <div class="reveal ${verdict[0]}" style="margin-top:14px">
      <span class="lbl">Réalité ≈ ${f.val.toLocaleString('fr-FR')} ${f.unit}</span>
      Ton pari : ${est.toLocaleString('fr-FR')} · écart : <b>${orders.toFixed(1)} ordre(s) de grandeur</b>. ${verdict[1]}<br>
      <span style="color:var(--dim)">${f.path}</span>
    </div>
    <button class="btn ghost" onclick="startFermi()">Autre estimation →</button>`;
  document.getElementById('feReveal').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* boot */
render();
</script>
</body>
</html>
